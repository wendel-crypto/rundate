<html lang="en">

<style>

.screen{position:absolute;inset:0;display:none;overflow-y:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}.screen::-webkit-scrollbar{display:none}.screen.on{display:block;animation:fd .22s ease}
@keyframes fd{from{opacity:0}}

function renderProfile(){$('#s-profile').innerHTML=profileHTML('me')+'';bindHero($('#s-profile'),'me')}
function renderProfileInto(id,keep){const el=$('#pp');const st=el.scrollTop;el.innerHTML=`<div class="snav"><button class="ib" onclick="$('#sh-p').classList.remove('on');curProfile=null">${ic('back')}</button></div>`+profileHTML(id)+profileCTA(id);bindHero(el,id);if(keep)el.scrollTop=st;else el.scrollTop=0}
function profileCTA(id){if(matched.includes(id))return `<div class="pcta"><button class="cta" onclick="openChat('${id}')">${ic('chat').replace('class="i"','class="i" style="vertical-align:-5px;margin-right:6px"')}${t('sayHi')}</button></div>`;const s=lockState();
return `<div class="pcta"><button class="ghost" style="width:64px;flex:none;color:#ff8fab" onclick="passFromProfile('${id}')">${ic('x')}</button><button class="cta ${s!=='open'?'locked':''}" onclick="likeFromProfile('${id}')">${s==='open'?'♥ '+t('likeBtn')+' '+BY[id].n:s==='norun'?'🔒 '+t('logBtn'):'🔒 '+t('unlockBtn')+' '+remain().txt}</button></div>`}
function likeFromProfile(id){if(lockState()!=='open'){lockedLike();return}$('#sh-p').classList.remove('on');if(deck[idx]===id){swipe(1)}else{onLike(id)}}
function passFromProfile(id){$('#sh-p').classList.remove('on');if(deck[idx]===id)swipe(-1)}
function profileHTML(id){const p=BY[id],me=id==='me';const tb=ptab[id]||'about';const tabs=['about','stats','runs','gallery'].concat(me?['settings']:[]);
return `<div class="hero" data-hero><div class="bars">${p.photos.map((_,i)=>`<i class="${i===0?'on':''}"></i>`).join('')}</div>${p.photos.map((ph,i)=>`<img src="${U(ph,900)}" alt="" style="opacity:${i?0:1}">`).join('')}<button class="zone l" aria-label="prev"></button><button class="zone r" aria-label="next"></button></div>
<div class="pinfo"><h2>${me?p.full:p.n}${p.v!==false?ic('verified'):''}</h2><div class="meta">📍 ${me?'Brickell, Miami':p.dist+' mi '+t('away')} · ${p.lvl} · ${p.age}${!me&&p.on?' · <span style="color:var(--ok)">● '+t('online')+'</span>':''}</div>
<div class="pstrip"><div><b>${p.pace}</b><small>${t('paceL')}</small></div><div><b>${p.wk}mi</b><small>${t('weekly')}</small></div><div><b>${p.pr5}</b><small>${t('pr5k')}</small></div><div><b>${p.half}</b><small>${t('half')}</small></div></div></div>
<div class="ptabs">${tabs.map(k=>`<button class="${tb===k?'on':''}" onclick="ptab['${id}']='${k}';${me?'renderProfile()':`renderProfileInto('${id}',true)`}">${t(k)}</button>`).join('')}</div><div class="pane">${pane(id,tb)}</div>`}
function pane(id,tb){const p=BY[id];
if(tb==='about')return `<div class="box"><h4>${t('aboutMe')}</h4><p>${esc(p.bio)}</p></div><div class="box ff"><h4>${t('funFact')}</h4><p>${esc(p.fun)}</p></div><div class="box lf"><h4>${t('lookingFor')}</h4><div class="chips">${p.look.map(x=>`<span>${x}</span>`).join('')}</div></div><div class="qgrid"><div><small>${t('prefTime')}</small><b>${p.time}</b></div><div><small>${t('runDays')}</small><b>${p.days}</b></div><div><small>${t('nextRace')}</small><b>${p.race}</b></div><div><small>${t('yrsRunning')}</small><b>${p.yrs}</b></div></div>`;
if(tb==='stats'){const load=p.load||[p.wk-8,p.wk-4,p.wk-10,p.wk-2,p.wk+2,p.wk-6,p.wk+4,p.wk].map(x=>Math.max(4,x));const mx=Math.max(...load);
return `<div class="fl" style="margin-top:0">${t('prs')}</div><div class="prs"><div><b>${p.pr5}</b><small>5K</small></div><div><b>${p.half}</b><small>${t('half')}</small></div><div><b>${p.fm}</b><small>${t('full')}</small></div></div>
<div class="box"><h4>${t('load')}</h4><div class="chart">${load.map((v,i)=>`<div><em>${v}</em><i style="height:${v/mx*100}%"></i><small>W${i+1}</small></div>`).join('')}</div></div>
<div class="box"><h4>${t('physical')}</h4><div class="qgrid" style="margin-top:8px"><div><small>${t('height')}</small><b>${p.ht||'5\'7"'}</b></div><div><small>${t('restHr')}</small><b>${p.hr||48+p.yrs%9} bpm</b></div><div><small>${t('vo2')}</small><b>${p.vo2||Math.round(62-parseInt(p.pace))}</b></div><div><small>${t('weekly')}</small><b>${p.wk} mi</b></div></div></div>`}
if(tb==='runs'){const rs=id==='me'?myRuns:mkRuns(p);return `<div class="fl" style="margin-top:0">${t('recent')}</div>`+rs.map((r,i)=>`<div class="runrow"><span class="ic">${ic('run')}</span><div class="t"><b>${r[0]}</b><small>${['Today','Sun','Tue','Mon','Sat'][i]||''} · ${r[2]}</small></div><span class="d">${r[1]} mi</span></div>`).join('')}
if(tb==='gallery'){const g=id==='me'?ME.photos.concat(['1502904550040-7534597429ae','1539185441755-769473a23570']):p.photos.concat(posts.filter(x=>x.who===id).map(x=>x.img));return `<div class="masonry">${g.map((ph,i)=>`<button onclick="openLB('${id}',${i})"><img src="${U(ph,300)}" alt="" style="aspect-ratio:${[3/4,1,4/5,3/5,1,5/6][i%6]};object-fit:cover"></button>`).join('')}</div>`}
if(tb==='settings')return `<div class="box"><h4>${t('geofence')}</h4><div style="display:flex;align-items:center;gap:12px"><input type="range" min="0.5" max="5" step="0.1" value="${radius}" oninput="radius=(+this.value).toFixed(1);this.nextElementSibling.textContent=radius+' mi';renderTop()"><b class="mono" style="white-space:nowrap">${radius} mi</b></div><small style="color:var(--mut)">${t('geofenceS')}</small></div>
${[['routes','hideRoutes','hideRoutesS'],['online','showOnline',''],['verified','verifiedOnly','']].map(([k,a,b])=>`<div class="set"><div class="t"><b>${t(a)}</b>${b?`<small>${t(b)}</small>`:''}</div><button class="tgl ${prefs[k]?'on':''}" onclick="prefs['${k}']=!prefs['${k}'];this.classList.toggle('on')"></button></div>`).join('')}
<div class="set" style="border:0"><div class="t"><b>${t('language')}</b></div><div class="seg" style="width:170px">${['en','es','pt'].map(l=>`<button class="${L===l?'on':''}" onclick="setLang('${l}')">${l.toUpperCase()}</button>`).join('')}</div></div>`;
return ''}
function bindHero(root,id){const h=root.querySelector('[data-hero]');if(!h)return;let i=0;const imgs=h.querySelectorAll('img'),bars=h.querySelectorAll('.bars i');const set=n=>{i=(n+imgs.length)%imgs.length;imgs.forEach((im,k)=>im.style.opacity=k===i?1:0);bars.forEach((b,k)=>b.classList.toggle('on',k===i))};h.querySelector('.zone.l').onclick=()=>set(i-1);h.querySelector('.zone.r').onclick=()=>set(i+1)}
function openLB(id,i){const p=BY[id];const g=id==='me'?ME.photos.concat(['1502904550040-7534597429ae','1539185441755-769473a23570']):p.photos.concat(posts.filter(x=>x.who===id).map(x=>x.img));const el=$('#lb');const draw=k=>{el.innerHTML=`<div class="snav"><span class="sp"></span><button class="ib" onclick="$('#lb').classList.remove('on')">${ic('x')}</button></div><div class="main"><img src="${U(g[k],1100)}" alt=""><button style="position:absolute;inset:0 50% 0 0" onclick="this.closest('.lb')._d(${(k-1+g.length)%g.length})" aria-label="prev"></button><button style="position:absolute;inset:0 0 0 50%" onclick="this.closest('.lb')._d(${(k+1)%g.length})" aria-label="next"></button></div><div class="thumbs">${g.map((x,j)=>`<button class="${j===k?'on':''}" onclick="this.closest('.lb')._d(${j})"><img src="${U(x,120,120)}" alt=""></button>`).join('')}</div>`};el._d=draw;draw(i);el.classList.add('on')}
/* ---------- log activity ---------- */
let myRuns=[['Bayfront Park Loop','6.2','52:10'],['Key Biscayne Long Run','12.5','1:48:30'],['Track Tuesday Intervals','5.0','38:20'],['Recovery · Coconut Grove','4.2','39:05']];
let LG=null;
function openLog(){closeAll();LG={type:'easy',d:5.0,min:44,route:0,img:'1594882645126-14020914d58d',cap:''};renderLog()}
function paceOf(){const p=LG.min/LG.d,m=Math.floor(p),s=Math.round((p-m)*60);return `${m}:${String(s===60?0:s).padStart(2,'0')}`}
function renderLog(){const imgs=['1594882645126-14020914d58d','1502224562085-639556652f33','1525026198548-4baa812f1183','1528543606781-2f6e6857f318'];
modal(`<div class="grab"></div><div class="mh"><h3>${t('logTitle')}</h3><button class="ib" onclick="closeMod()">${ic('x')}</button></div>
<div class="fl" style="margin-top:0">${t('type')}</div><div class="opts">${['easy','longRun','intervals','recovery'].map(k=>`<button class="opt ${LG.type===k?'on':''}" onclick="LG.type='${k}';renderLog()">${t(k)}</button>`).join('')}</div>
<div class="fl">${t('distance')}</div><div class="num"><button onclick="LG.d=Math.max(1,+(LG.d-0.5).toFixed(1));renderLog()">−</button><b>${LG.d.toFixed(1)} <small>mi</small></b><button onclick="LG.d=+(LG.d+0.5).toFixed(1);renderLog()">＋</button></div>
<div class="fl">${t('duration')}</div><div class="num"><button onclick="LG.min=Math.max(5,LG.min-2);renderLog()">−</button><b>${Math.floor(LG.min/60)?Math.floor(LG.min/60)+':':''}${String(LG.min%60).padStart(Math.floor(LG.min/60)?2:1,'0')}:00 <small>· ${paceOf()}/mi</small></b><button onclick="LG.min+=2;renderLog()">＋</button></div>
<div class="fl">${t('route')}</div><select class="fld" onchange="LG.route=+this.value">${ROUTES.map((r,i)=>`<option value="${i}" ${LG.route===i?'selected':''}>${r}</option>`).join('')}</select>
<div class="fl">📷</div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">${imgs.map(x=>`<button style="aspect-ratio:1;border-radius:12px;overflow:hidden;border:2px solid ${LG.img===x?'var(--pink)':'transparent'}" onclick="LG.img='${x}';renderLog()"><img src="${U(x,200,200)}" alt="" style="width:100%;height:100%;object-fit:cover"></button>`).join('')}</div>
<div class="fl">${t('caption')}</div><input class="fld" value="${esc(LG.cap)}" oninput="LG.cap=this.value" placeholder="Morning miles 🌅">
<div class="rule">${ic('clock')}<span>${t('ruleLog')}</span></div>
<button class="cta" onclick="saveRun()">${t('save')}</button>`)}
function saveRun(){lastRun=NOW();const r=ROUTES[LG.route];myRuns.unshift([r,LG.d.toFixed(1),`${Math.floor(LG.min/60)?Math.floor(LG.min/60)+':':''}${String(LG.min%60).padStart(2,'0')}:00`]);
posts.unshift({id:Date.now(),who:'me',type:'run',img:LG.img,d:LG.d.toFixed(1),pace:paceOf(),time:myRuns[0][2],el:String(Math.round(LG.d*9)),cap:LG.cap||`${t(LG.type)} · ${r}`,likes:0,cm:[],ago:t('now'),route:r});
ME.wk=+(ME.wk+LG.d).toFixed(1);
modal(`<div class="grab"></div><div class="done"><div class="ck">${ic('check')}</div><h3>${t('saved')}</h3><p>${r}</p></div><div class="big"><div><b>${LG.d.toFixed(1)}</b><small>${t('mi')}</small></div><div><b>${paceOf()}</b><small>${t('paceL')}</small></div><div><b>${myRuns[0][2]}</b><small>${t('time')}</small></div></div>
<div class="rule">${ic('lock')}<span>${t('savedB',{h:unlockAt()})} <b style="color:#fff">${remain().txt}</b></span></div><button class="cta" onclick="closeMod();go('feed')">${t('viewFeed')}</button><button class="ghost" style="margin-top:10px" onclick="closeMod()">${t('done')}</button>`);refresh()}
/* ---------- modal / lang / loop ---------- */
function modal(h){$('#mp').innerHTML=h;$('#mod').classList.add('on')}
function closeMod(){$('#mod').classList.remove('on')}
$('#mod').addEventListener('click',e=>{if(e.target.id==='mod')closeMod()});
function setLang(l){L=l;try{localStorage.setItem('rd-lang',l)}catch(e){}document.documentElement.lang=l;renderTop();renderTab();const keep=curProfile;go(tab);if(keep)openProfile(keep)}
setInterval(()=>{const s=lockState();const lp=$('#lp span');if(lp)lp.textContent=s==='open'?t('unlocked'):s==='norun'?t('logToUnlock'):remain().txt;const mc=$('#mclock');if(mc)mc.textContent=remain().clock;const lk=$('#lkc');if(lk&&s==='counting')lk.textContent=remain().txt;if(s!==refresh._s){refresh._s=s;refresh()}},1000);
window.addEventListener('message',e=>{const d=e.data||{};if(d.rd==='lang'&&['en','es','pt'].includes(d.v)&&d.v!==L)setLang(d.v);if(d.rd==='go')route(d.v)});
function route(v){closeAll();if(['discover','feed','matches','profile'].includes(v))go(v);else if(v==='log'){go('discover');openLog()}else if(v==='card'){go('discover');openProfile(deck[idx]||'camila')}else if(v==='lock'){go('discover');setTimeout(()=>swipe(1),400)}else if(v==='unlock'){if(lockState()!=='open')lastRun-=LOCK;go('discover')}else if(v==='chat'){go('matches');openChat('camila')}else if(v==='stats'){ptab.me='stats';go('profile')}else if(v==='gallery'){ptab.me='gallery';go('profile')}else if(v==='story'){go('feed');openStory(0)}}
document.documentElement.lang=L;refresh._s=lockState();renderTop();renderTab();go('discover');if(q.get('screen'))route(q.get('screen'));
</script>
</body>
</html>
